<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bandeja — падел-платформа</title>
    <meta name="description" content="Bandeja — платформа обучения паделу: от первого удара до первого турнира." />
    <meta property="og:title" content="Bandeja — падел-платформа" />
    <meta property="og:description" content="Онлайн-школа и цифровой помощник игрока в паделе." />
    <meta property="og:image" content="lesson-poster.jpg" />
    <script>
      // Тема: следует системной настройке, как в приложении (класс .dark — конвенция shadcn)
      (function () {
        var mq = window.matchMedia("(prefers-color-scheme: dark)")
        var apply = function () {
          var forced = document.documentElement.getAttribute("data-theme")
          var dark = forced ? forced === "dark" : mq.matches
          document.documentElement.classList.toggle("dark", dark)
        }
        apply()
        mq.addEventListener("change", apply)
        new MutationObserver(apply).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] })
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
